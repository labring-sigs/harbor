---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-controller
  namespace: harbor-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor-controller
rules:
  - apiGroups: ["harbor.sealos.io"]
    resources: ["harborprojects"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["harbor.sealos.io"]
    resources: ["harborprojects/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["harbor.sealos.io"]
    resources: ["harborprojects/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harbor-controller
subjects:
  - kind: ServiceAccount
    name: harbor-controller
    namespace: harbor-system
