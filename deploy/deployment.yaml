---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-controller
  namespace: harbor-system
  labels:
    app.kubernetes.io/name: harbor-controller
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-controller
    spec:
      serviceAccountName: harbor-controller
      containers:
        - name: manager
          image: ghcr.io/dinoallo/labring-sigs-harbor:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
          env:
            - name: HARBOR_ENDPOINT
              value: "https://core.harbor.svc:8443"
            - name: HARBOR_ADMIN_USERNAME
              value: "admin"
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-admin-password
                  key: password
                  optional: false
            - name: REGISTRY_HOST
              value: "registry.sealos.io"
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
