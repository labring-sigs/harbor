# ---------------------------------------------------------------------------
# CI workflow – build, test, and push the controller image to ghcr.io
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ###########################################################################
  # Unit tests & binary build
  ###########################################################################
  build:
    name: Build and unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go mod verify
        run: go mod verify

      - name: Build binary
        run: make build

      - name: Run unit tests
        run: go test -v -count=1 -short ./internal/...

  ###########################################################################
  # Integration tests (envtest)
  # Downloads envtest binaries (etcd + kube-apiserver) via setup-envtest.
  ###########################################################################
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest

      - name: Download envtest binaries
        run: |
          mkdir -p /tmp/envtest-bin
          source <(setup-envtest use 1.31.x -p env --bin-dir /tmp/envtest-bin)
          echo "KUBEBUILDER_ASSETS=$KUBEBUILDER_ASSETS" >> $GITHUB_ENV

      - name: Run integration tests
        run: go test -v -count=1 ./controllers/...

  ###########################################################################
  # Docker image – build & push (main branch only)
  ###########################################################################
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [build, integration]
    # Only push images on push to main, not on PRs
    if: github.event_name == 'push' && github.ref_name == 'main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
