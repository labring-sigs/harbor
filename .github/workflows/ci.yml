# ---------------------------------------------------------------------------
# CI workflow – build, test, and push the controller image to ghcr.io
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger for e2e tests
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run end-to-end tests (requires Docker)'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ###########################################################################
  # Unit tests & binary build
  ###########################################################################
  build:
    name: Build and unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go mod verify
        run: go mod verify

      - name: Build binary
        run: make build

      - name: Run unit tests
        env:
          SKIP_TC: "1"
          SKIP_E2E: "1"
        run: go test -v -count=1 -short ./internal/...

  ###########################################################################
  # Integration tests (envtest)
  # Downloads envtest binaries (etcd + kube-apiserver) via setup-envtest.
  ###########################################################################
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.1

      - name: Download envtest binaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/envtest-bin

          ENVTEST_OUTPUT="$(setup-envtest use 1.37.x -p env --bin-dir /tmp/envtest-bin)"

          eval "$ENVTEST_OUTPUT"

          if [ -z "${KUBEBUILDER_ASSETS:-}" ]; then
            echo "::error::setup-envtest did not set KUBEBUILDER_ASSETS"
            echo "::group::setup-envtest stdout"
            echo "$ENVTEST_OUTPUT"
            echo "::endgroup::"
            exit 1
          fi

          echo "envtest binaries resolved to: $KUBEBUILDER_ASSETS"
          ls -la "$KUBEBUILDER_ASSETS"
          echo "KUBEBUILDER_ASSETS=$KUBEBUILDER_ASSETS" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: |
          echo "KUBEBUILDER_ASSETS=${KUBEBUILDER_ASSETS}"
          go test -v -count=1 ./controllers/...

  ###########################################################################
  # E2E tests (requires Docker + envtest)
  # Runs on workflow_dispatch only (heavy, requires Docker).
  ###########################################################################
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.1

      - name: Download envtest binaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/envtest-bin

          ENVTEST_OUTPUT="$(setup-envtest use 1.37.x -p env --bin-dir /tmp/envtest-bin)"

          eval "$ENVTEST_OUTPUT"

          if [ -z "${KUBEBUILDER_ASSETS:-}" ]; then
            echo "::error::setup-envtest did not set KUBEBUILDER_ASSETS"
            exit 1
          fi

          echo "KUBEBUILDER_ASSETS=$KUBEBUILDER_ASSETS" >> "$GITHUB_ENV"

      - name: Run e2e tests
        run: |
          go test -v -count=1 -run 'TestE2E_' ./controllers/...

  ###########################################################################
  # Docker image – build & push (main branch only)
  ###########################################################################
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [build, integration]
    # Only push images on push to main, not on PRs
    if: github.event_name == 'push' && github.ref_name == 'main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
