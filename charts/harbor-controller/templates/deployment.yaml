apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harbor-controller.fullname" . }}
  labels:
    {{- include "harbor-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "harbor-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "harbor-controller.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "harbor-controller.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            {{- if .Values.metrics.bindAddress }}
            - --metrics-bind-address={{ .Values.metrics.bindAddress }}
            {{- end }}
            {{- if .Values.autoProvision.enabled }}
            - --enable-project-auto-provision
            - --owner-label-key={{ .Values.autoProvision.ownerLabelKey }}
            - --default-storage-limit={{ .Values.autoProvision.defaultStorageLimit }}
            {{- end }}
            {{- range .Values.controllerArgs }}
            {{- if and $.Values.leaderElection.enabled (eq . "--leader-elect") }}{{- else }}
            - {{ . }}
            {{- end }}
            {{- end }}
          env:
            - name: HARBOR_ENDPOINT
              value: {{ .Values.harbor.endpoint | quote }}
            - name: HARBOR_ADMIN_USERNAME
              value: {{ .Values.harbor.adminUsername | quote }}
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.harbor.adminPasswordSecret.name }}
                  key: {{ .Values.harbor.adminPasswordSecret.key }}
                  optional: false
            - name: REGISTRY_HOST
              value: {{ include "harbor-controller.registryHost" . | quote }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.metrics.bindAddress | default ":8080" | trimPrefix ":" }}
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.health.path }}
              port: {{ .Values.probes.health.port }}
            initialDelaySeconds: {{ .Values.probes.health.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.health.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
