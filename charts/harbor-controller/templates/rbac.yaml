{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "harbor-controller.fullname" . }}
  labels:
    {{- include "harbor-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["harbor.sealos.io"]
    resources: ["harborprojects"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["harbor.sealos.io"]
    resources: ["harborprojects/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["harbor.sealos.io"]
    resources: ["harborprojects/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "harbor-controller.fullname" . }}
  labels:
    {{- include "harbor-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "harbor-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "harbor-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
