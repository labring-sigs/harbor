# ---------------------------------------------------------------------------
# Unified values for the harbor-stack umbrella chart.
#
# Two subcharts are included:
#   1) harbor       — minimal Harbor deployment (disabled by default)
#   2) harbor-controller — the HarborProject CRD controller (always enabled)
#
# Set `harbor.enabled=false` (the default) to use an existing external
# Harbor instance.  Set `harbor.enabled=true` to deploy a bundled minimal
# Harbor alongside the controller.
# ---------------------------------------------------------------------------

# ── Harbor (minimal) ───────────────────────────────────────────────────────
harbor:
  # Set to true to deploy a bundled minimal Harbor instance.
  enabled: false
  # The initial admin password (optional).  When set (non-empty), this value is
  # used to create the shared `harbor-admin-password` Secret that both the Harbor
  # subchart and the controller reference.  When empty (the default), a random
  # 16-character password is generated on first install and preserved across
  # upgrades in the same Secret.
  adminPassword: ""
  # Disable the subchart's own admin-password-secret template because
  # this umbrella chart creates the Secret itself (see
  # templates/admin-password-secret.yaml) with the same lookup+randAlphaNum
  # pattern.
  createAdminPasswordSecret: false

  # These values are forwarded to the harbor subchart,
  # which in turn forwards them to the official harbor-helm subchart.
  # See charts/harbor/values.yaml for all available options.
  # Tell the official harbor-helm chart to use the same password Secret
  # created by admin-password-secret.yaml.
  harbor:
    existingSecretAdminPassword: "harbor-admin-password"
    existingSecretAdminPasswordKey: "password"
    expose:
      type: clusterIP
      tls:
        enabled: false
      clusterIP:
        name: harbor
        ports:
          httpPort: 80
          httpsPort: 443
      ingress:
        hosts:
          core: core.harbor.domain
        annotations:
          ingress.kubernetes.io/ssl-redirect: "true"
          ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
          nginx.ingress.kubernetes.io/proxy-body-size: "0"

    externalURL: http://core.harbor.domain
    portal:
      enabled: false
    trivy:
      enabled: false
    notary:
      enabled: false
    chartmuseum:
      enabled: false
    exporter:
      enabled: false
    persistence:
      enabled: true
      # ---- Registry image/chart storage backend ----
      # To use S3-compatible storage (e.g., MinIO) for the bundled deployment,
      # uncomment and customize the imageChartStorage section below.
      #
      # The S3 credentials must be supplied via a Kubernetes secret.
      # Required secret keys:
      #   REGISTRY_STORAGE_S3_ACCESSKEY
      #   REGISTRY_STORAGE_S3_SECRETKEY
      #
      # Example:
      #   imageChartStorage:
      #     disableredirect: true
      #     type: s3
      #     s3:
      #       existingSecret: "harbor-s3-credentials"
      #       region: us-east-1
      #       bucket: harbor-registry
      #       regionendpoint: http://minio.minio.svc:9000
      #       secure: false
      #       v4auth: true
      #       rootdirectory: /registry
    database:
      type: internal
    redis:
      type: internal

# ── Harbor Controller ──────────────────────────────────────────────────────
harbor-controller:
  enabled: true

  # When deploying bundled Harbor, point the controller to the local
  # Harbor service.  When using external Harbor, override these values.
  harbor:
    endpoint: "http://harbor:80"
    adminUsername: "admin"
    adminPasswordSecret:
      name: "harbor-admin-password"
      key: "password"
    registryHost: "harbor:80"

  image:
    repository: ghcr.io/dinoallo/labring-sigs-harbor
    pullPolicy: IfNotPresent
    tag: "latest"

  controllerArgs: []

  probes:
    health:
      path: /healthz
      port: 8081
      initialDelaySeconds: 15
      periodSeconds: 20
    readiness:
      path: /readyz
      port: 8081
      initialDelaySeconds: 5
      periodSeconds: 10

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
