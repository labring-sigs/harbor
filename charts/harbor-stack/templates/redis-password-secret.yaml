{{- if and .Values.harbor.enabled .Values.harbor.redisPassword (not (empty .Values.harbor.redisPassword)) }}
# Auto-create a redis password Secret from the plaintext value in
# .Values.harbor.redisPassword.  This allows users to migrate from
# plaintext passwords to external Kubernetes Secrets without breaking
# existing deployments.
#
# When .Values.harbor.harbor.redis.external.existingSecret is also
# provided, the existingSecret takes precedence and the password in this
# Secret is used.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harbor-stack.redisPasswordSecret" . }}
  labels:
    {{- include "harbor-stack.labels" . | nindent 4 }}
type: Opaque
data:
  REDIS_PASSWORD: {{ .Values.harbor.redisPassword | b64enc | quote }}
{{- end }}
