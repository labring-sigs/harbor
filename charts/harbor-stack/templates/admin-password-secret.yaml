{{- if .Values.harbor.enabled }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace (include "harbor-stack.adminPasswordSecret" .) -}}
{{- $existingPassword := "" -}}
{{- if $secret -}}
  {{- $existingPassword = $secret.data.password | b64dec -}}
{{- end -}}
{{- $password := .Values.harbor.adminPassword | default ($existingPassword | default (randAlphaNum 16)) -}}
# Create the shared admin password secret used by both Harbor and the controller.
# The password value comes from .Values.harbor.adminPassword (if set),
# otherwise the existing Secret value is preserved on upgrades,
# or a random 16-character string is generated on first install.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harbor-stack.adminPasswordSecret" . }}
  labels:
    {{- include "harbor-stack.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
