{{- if .Values.harbor.enabled }}
# Create the shared admin password secret used by both Harbor and the controller.
# The password value comes from .Values.harbor.adminPassword
# (defaults to "Harbor12345" if not set).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harbor-stack.adminPasswordSecret" . }}
  labels:
    {{- include "harbor-stack.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ (.Values.harbor.adminPassword | default "Harbor12345") | b64enc | quote }}
{{- end }}
