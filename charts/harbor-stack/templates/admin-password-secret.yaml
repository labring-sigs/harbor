{{- if .Values.harbor.enabled }}
{{- $ourSecret := lookup "v1" "Secret" .Release.Namespace (include "harbor-stack.adminPasswordSecret" .) -}}
{{- $password := .Values.harbor.adminPassword | default "" -}}

{{- if not $password -}}
  {{- /* No explicit override: try existing Secret first, then migrate from old chart */ -}}
  {{- if $ourSecret -}}
    {{- /* Preserve existing password on upgrades */ -}}
    {{- $password = $ourSecret.data.password | b64dec -}}
  {{- else -}}
    {{- /* First-time upgrade from old chart: migrate password from the official   */ -}}
    {{- /* harbor-helm core Secret (which contained HARBOR_ADMIN_PASSWORD before    */ -}}
    {{- /* we introduced existingSecretAdminPassword in the subchart).              */ -}}
    {{- $chartName := default "harbor" .Values.harbor.harbor.nameOverride -}}
    {{- $fullname := .Release.Name -}}
    {{- if not (contains $chartName .Release.Name) -}}
      {{- $fullname = printf "%s-%s" .Release.Name $chartName -}}
    {{- end -}}
    {{- $oldSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-core" $fullname) -}}
    {{- $oldPassword := "" -}}
    {{- if $oldSecret -}}
      {{- $oldPassword = get $oldSecret.data "HARBOR_ADMIN_PASSWORD" | default "" -}}
    {{- end -}}
    {{- if $oldPassword -}}
      {{- $password = $oldPassword | b64dec -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- if not $password -}}
  {{- /* Generate a random 16-character password on first install */ -}}
  {{- $password = randAlphaNum 16 -}}
{{- end -}}
# Create the shared admin password secret used by both Harbor and the controller.
# The password value comes from .Values.harbor.adminPassword (if set),
# otherwise the existing Secret value is preserved on upgrades,
# or a random 16-character string is generated on first install.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harbor-stack.adminPasswordSecret" . }}
  labels:
    {{- include "harbor-stack.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
