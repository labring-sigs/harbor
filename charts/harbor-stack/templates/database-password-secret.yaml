{{- if and .Values.harbor.enabled .Values.harbor.databasePassword (not (empty .Values.harbor.databasePassword)) }}
# Auto-create a database password Secret from the plaintext value in
# .Values.harbor.databasePassword.  This allows users to migrate from
# plaintext passwords to external Kubernetes Secrets without breaking
# existing deployments.
#
# When .Values.harbor.harbor.database.external.existingSecret is also
# provided, the existingSecret takes precedence and the password in this
# Secret is used.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harbor-stack.databasePasswordSecret" . }}
  labels:
    {{- include "harbor-stack.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.harbor.databasePassword | b64enc | quote }}
{{- end }}
