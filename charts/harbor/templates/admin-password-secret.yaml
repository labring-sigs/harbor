{{- if and .Values.enabled .Values.createAdminPasswordSecret }}
{{- $ourSecret := lookup "v1" "Secret" .Release.Namespace "harbor-admin-password" -}}
{{- $password := .Values.harbor.harborAdminPassword | default "" -}}

{{- if not $password -}}
  {{- /* No explicit override: try existing Secret first, then migrate from old chart */ -}}
  {{- if $ourSecret -}}
    {{- /* Preserve existing password on upgrades */ -}}
    {{- $password = $ourSecret.data.password | b64dec -}}
  {{- else -}}
    {{- /* First-time upgrade from old chart: migrate password from the official   */ -}}
    {{- /* harbor-helm core Secret (which contained HARBOR_ADMIN_PASSWORD before    */ -}}
    {{- /* we introduced existingSecretAdminPassword).                               */ -}}
    {{- /* Compute fullname using the same logic as the official harbor-helm chart */ -}}
    {{- $fo := .Values.harbor.fullnameOverride -}}
    {{- $no := .Values.harbor.nameOverride -}}
    {{- $fullname := "" -}}
    {{- if $fo -}}
      {{- $fullname = $fo | trunc 63 | trimSuffix "-" -}}
    {{- else -}}
      {{- $name := $no | default "harbor" -}}
      {{- if contains $name .Release.Name -}}
        {{- $fullname = .Release.Name | trunc 63 | trimSuffix "-" -}}
      {{- else -}}
        {{- $fullname = printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" -}}
      {{- end -}}
    {{- end -}}
    {{- $oldSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-core" $fullname) -}}
    {{- $oldPassword := "" -}}
    {{- if $oldSecret -}}
      {{- $oldPassword = get $oldSecret.data "HARBOR_ADMIN_PASSWORD" | default "" -}}
    {{- end -}}
    {{- if $oldPassword -}}
      {{- $password = $oldPassword | b64dec -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- if not $password -}}
  {{- /* Generate a random 16-character password on first install */ -}}
  {{- $password = randAlphaNum 16 -}}
{{- end -}}
# Create the admin password secret used by the official harbor-helm subchart.
# The password value comes from .Values.harbor.harborAdminPassword (if set),
# otherwise the existing Secret value is preserved on upgrades,
# or a random 16-character string is generated on first install.
apiVersion: v1
kind: Secret
metadata:
  name: harbor-admin-password
  labels:
    app.kubernetes.io/name: "harbor"
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
