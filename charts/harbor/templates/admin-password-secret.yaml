{{- if and .Values.enabled .Values.createAdminPasswordSecret }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace "harbor-admin-password" -}}
{{- $existingPassword := "" -}}
{{- if $secret -}}
  {{- $existingPassword = $secret.data.password | b64dec -}}
{{- end -}}
{{- $password := .Values.harbor.harborAdminPassword | default ($existingPassword | default (randAlphaNum 16)) -}}
# Create the admin password secret used by the official harbor-helm subchart.
# The password value comes from .Values.harbor.harborAdminPassword (if set),
# otherwise the existing Secret value is preserved on upgrades,
# or a random 16-character string is generated on first install.
apiVersion: v1
kind: Secret
metadata:
  name: harbor-admin-password
  labels:
    app.kubernetes.io/name: "harbor"
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
