# ---------------------------------------------------------------------------
# Minimal Harbor deployment values for the Harbor Controller.
# Only the components needed for project/robot-account management are enabled:
#   ✅ core       (Harbor API — required)
#   ✅ registry   (OCI distribution — required)
#   ✅ jobservice (internal async tasks — required)
#   ✅ database   (PostgreSQL — required by core)
#   ✅ redis      (required by core & jobservice)
#
#   ❌ portal     (Web UI — not needed, controller manages via API)
#   ❌ trivy      (Vulnerability scanner — not required)
#   ❌ notary     (Content trust — not required)
#   ❌ chartmuseum (Helm chart repo — not required)
#   ❌ exporter   (Metrics exporter — not required)
# ---------------------------------------------------------------------------
# NOTE: Values for the official harbor-helm subchart are nested under the
# `harbor:` key.  The top-level keys in this file are the **wrapper chart's**
# own values.
# ---------------------------------------------------------------------------

# ── Wrapper chart options ──────────────────────────────────────────────────
# Set to false to disable deploying Harbor altogether
enabled: true

# ── Subchart overrides (these are forwarded to the official harbor-helm) ──
harbor:
  # ---- Initial admin password (default: "Harbor12345") ----
  # Change this immediately after deployment!
  harborAdminPassword: "Harbor12345"

  # ---- Networking ----
  expose:
    type: clusterIP
    tls:
      enabled: false
    clusterIP:
      name: harbor
      ports:
        httpPort: 80
        httpsPort: 443
    ingress:
      hosts:
        core: core.harbor.domain
      annotations:
        ingress.kubernetes.io/ssl-redirect: "true"
        ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/proxy-body-size: "0"

  # The external URL for token generation
  externalURL: http://core.harbor.domain

  # ---- Components to disable ----
  portal:
    enabled: false

  trivy:
    enabled: false

  notary:
    enabled: false

  chartmuseum:
    enabled: false

  exporter:
    enabled: false

  # ---- Components to keep (defaults are fine) ----
  # core:          (kept)
  # registry:      (kept)
  # jobservice:    (kept)
  # database:      (kept)
  # redis:         (kept)

  # ---- Persistence ----
  # Harbor supports multiple storage backends for the image/chart registry.
  # For production deployments, especially in Sealos Cloud, we recommend
  # using S3-compatible storage (e.g., MinIO) instead of PVCs.
  #
  # To configure S3 storage, uncomment and customize the `imageChartStorage`
  # section below.  Credentials can be supplied via a Kubernetes secret
  # referenced by `existingSecret` (recommended) or inline with
  # `accesskey` / `secretkey`.
  #
  # Required secret keys when using `existingSecret`:
  #   REGISTRY_STORAGE_S3_ACCESSKEY
  #   REGISTRY_STORAGE_S3_SECRETKEY
  #
  # Example MinIO/S3 secret:
  #   apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: harbor-s3-credentials
  #   type: Opaque
  #   data:
  #     REGISTRY_STORAGE_S3_ACCESSKEY: <base64-access-key>
  #     REGISTRY_STORAGE_S3_SECRETKEY: <base64-secret-key>
  # ---
  persistence:
    enabled: true
    # persistentVolumeClaim:
    #   registry:
    #     storageClass: ""
    #     size: 100Gi
    #   jobservice:
    #     storageClass: ""
    #     size: 10Gi
    #   database:
    #     storageClass: ""
    #     size: 10Gi
    #   redis:
    #     storageClass: ""
    #     size: 5Gi
    # ---- Registry image/chart storage backend ----
    # Uncomment and set `type: s3` to use S3-compatible storage (MinIO, etc.).
    # When `type` is `filesystem` (default) the PVC block above applies.
    # imageChartStorage:
    #   # Disable HTTP redirect for backends that don't support it (e.g. MinIO).
    #   # See https://github.com/distribution/distribution/blob/release/2.8/docs/configuration.md#redirect
    #   disableredirect: true
    #   # Storage type: "filesystem", "azure", "gcs", "s3", "swift", "oss"
    #   type: s3
    #   filesystem:
    #     rootdirectory: /storage
    #   s3:
    #     # Use an existing secret (recommended) instead of plaintext keys.
    #     # Keys: REGISTRY_STORAGE_S3_ACCESSKEY, REGISTRY_STORAGE_S3_SECRETKEY
    #     # existingSecret: "harbor-s3-credentials"
    #     # Inline credentials (alternative to existingSecret; not recommended for production):
    #     # accesskey: "minioadmin"
    #     # secretkey: "minioadmin"
    #     region: us-east-1
    #     bucket: harbor-registry
    #     # S3-compatible endpoint (required for MinIO; omit for AWS S3).
    #     regionendpoint: http://minio.minio.svc:9000
    #     # Set to false when using HTTP endpoints (MinIO without TLS).
    #     secure: false
    #     # Enable AWS Signature v4 (required for most S3-compatible backends).
    #     v4auth: true
    #     # Root directory within the bucket (optional).
    #     # rootdirectory: /registry
    #     # Encryption settings (optional).
    #     # encrypt: false
    #     # keyid: mykeyid
    #     # Skip TLS certificate verification (not recommended for production).
    #     # skipverify: false
    #     # S3 storage class (optional).
    #     # storageclass: STANDARD
    #     # Multipart upload settings (optional).
    #     # chunksize: "5242880"
    #     # multipartcopychunksize: "33554432"
    #     # multipartcopymaxconcurrency: 100
    #     # multipartcopythresholdsize: "33554432"

  # ---- Database ----
  database:
    type: internal
    internal:
      image:
        repository: docker.io/goharbor/harbor-db
        tag: v2.15.2

  # ---- Redis ----
  redis:
    type: internal
    internal:
      image:
        repository: docker.io/goharbor/valkey-photon
        tag: v2.15.2

  # ---- Resource sizing (adjust as needed for your cluster) ----
  # resources:
  #   core:
  #     requests:
  #       cpu: 500m
  #       memory: 512Mi
  #     limits:
  #       cpu: 1
  #       memory: 1Gi
  #   registry:
  #     requests:
  #       cpu: 300m
  #       memory: 256Mi
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi
  #   jobservice:
  #     requests:
  #       cpu: 300m
  #       memory: 256Mi
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi
